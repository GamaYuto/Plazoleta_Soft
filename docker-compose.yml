version: '3.9'
services:
  postgres-restaurante:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: restaurante_db
    ports:
      - 5433:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-pedidos:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pedidos_db
    ports:
      - 5434:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-auth:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_db
    ports:
      - 5435:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - 6379:6379
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-trazabilidad:
    image: mongo:6.0
    environment:
      MONGO_INITDB_DATABASE: trazabilidad_db
    ports:
      - 27017:27017
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand({ping:1})' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  ms-restaurante:
    build:
      context: ./ms-restaurante
    ports:
      - 8081:8080
    depends_on:
      postgres-restaurante:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-restaurante:5432/restaurante_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

  ms-pedidos:
    build:
      context: ./ms-pedidos
    ports:
      - 8082:8080
    depends_on:
      postgres-pedidos:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-pedidos:5432/pedidos_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379

  ms-auth:
    build:
      context: ./ms-auth
    ports:
      - 8083:8080
    depends_on:
      postgres-auth:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-auth:5432/auth_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

  ms-trazabilidad:
    build:
      context: ./ms-trazabilidad
    ports:
      - 8084:8080
    depends_on:
      mongo-trazabilidad:
        condition: service_healthy
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongo-trazabilidad:27017/trazabilidad_db

  ms-notificaciones:
    build:
      context: ./ms-notificaciones
    ports:
      - 8085:8080

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - ms-auth
      - ms-restaurante
      - ms-pedidos
      - ms-trazabilidad
      - ms-notificaciones
